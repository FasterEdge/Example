name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v7
      with:
        go-version: '1.26'
    - name: '静态检查 go vet'
      run: go vet ./...
    - name: '单元测试'
      run: go test ./...
